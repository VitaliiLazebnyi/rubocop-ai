---
# Maximum-strictness configuration: every cop of RuboCop and of every plugin is enabled (AllCops: EnabledByDefault),
# including the pending and the disabled-by-default ones, and fails the build. There is no todo file, and inline
# RuboCop directives are forbidden (Style/DisableCopsWithinSourceCodeDirective, script/forbidden_suppressions.sh).
# What follows is only settings, a few files a cop cannot apply to, and the cops that cannot hold here, each with the
# reason. The keys are sorted (yamllint key-ordering).

# The cop's own documentation (its YARD example) quotes, as its "bad" example, the adverb chain the cop reports.
# rubocop-md hands the prose of a Markdown file to every cop as Ruby comments, and the documents (README.md,
# BUGS.md, REQUIREMENTS.md, ...) quote that example too; only their Ruby code blocks are Ruby.
AI/AdverbSpam:
  Exclude:
    - "**/*.md"
    - lib/rubocop/cop/ai/adverb_spam.rb

AllCops:
  EnabledByDefault: true
  Exclude:
    - .yardoc/**/*
    - coverage/**/*
    - doc/**/*
    - sorbet/rbi/gems/**/*
    - tmp/**/*
    - vendor/**/*
  NewCops: enable
  SuggestExtensions: false
  TargetRubyVersion: 3.3

# A gem from a `path:` source has exactly one version, the one of that checkout (gemfiles/oldest.gemfile installs
# rubocop-ai from this repository).
Bundler/GemVersion:
  AllowedGems:
    - rubocop-ai

Gemspec/DevelopmentDependencies:
  EnforcedStyle: gemspec

# editorconfig-checker requires every indentation to be a multiple of the indentation size (.editorconfig), so
# continued lines are indented by a fixed step instead of being aligned with a column of the line above.
Layout/ArgumentAlignment:
  EnforcedStyle: with_fixed_indentation
Layout/ArrayAlignment:
  EnforcedStyle: with_fixed_indentation
Layout/LineEndStringConcatenationIndentation:
  EnforcedStyle: indented
Layout/MultilineMethodCallIndentation:
  EnforcedStyle: indented
Layout/MultilineOperationIndentation:
  EnforcedStyle: indented
Layout/ParameterAlignment:
  EnforcedStyle: with_fixed_indentation

# Fully qualifying every constant (`::File`, `::RuboCop::Cop::AI::AdverbSpam::SPAM_PATTERN`) cannot hold together
# with mutation testing: mutant turns each `::Name` into `Name`, a mutation no test can tell apart, so 100% killed
# mutations becomes unreachable. It also cannot name a private constant, which is only reachable unqualified.
Lint/ConstantResolution:
  Enabled: false

# Sorbet signatures name every parameter, including the block, so anonymous block forwarding (`&`) cannot be used in
# typed code.
Naming/BlockForwarding:
  EnforcedStyle: explicit

Naming/FileName:
  Exclude:
    # rubocop-md checks the code blocks of Markdown files as if each file were a Ruby file.
    - "**/*.md"
    # The gem's entry point is named after the gem, as `require 'rubocop-ai'` expects.
    - lib/rubocop-ai.rb

# Cop specs state each offense and its correction as two heredocs of source code; a heredoc is one example input,
# not example logic, so it counts as one line.
RSpec/ExampleLength:
  CountAsOne:
    - heredoc

# These cops forbid Sorbet altogether (`sig`, `T::Sig`, `T.let`): they exist for codebases that remove Sorbet, and
# contradict Sorbet/EnforceSignatures and the `typed: strong` library.
Sorbet/ForbidSig:
  Enabled: false
Sorbet/ForbidTLet:
  Enabled: false
Sorbet/ForbidTSig:
  Enabled: false

# Only for applications that monkey patch `Module` to include T::Sig everywhere. A gem must not patch `Module`, so
# every class that declares signatures extends T::Sig itself.
Sorbet/RedundantExtendTSig:
  Enabled: false

# Every Ruby file is at least `typed: strict`, except the example files of the specs (`*_spec.rb`), which are
# `typed: false`: Sorbet runs the blocks of the RSpec DSL (`describe`, `it`, `let`, ...) with the `self` of the
# file, where `expect`, `let` and the matchers do not exist, and binding `self` needs `T.bind`, which is forbidden.
# spec_helper.rb and spec/support/ are `typed: strict`.
Sorbet/StrictSigil:
  Exclude:
    - spec/**/*_spec.rb

# lib/ is `typed: strong`; the RuboCop APIs it calls are typed in sorbet/rbi/shims/rubocop.rbi.
Sorbet/StrongSigil:
  Include:
    - lib/**/*.rb

Sorbet/TrueSigil:
  Exclude:
    - spec/**/*_spec.rb

Style/Copyright:
  AutocorrectNotice: "# Copyright (c) 2026 Vitalii Lazebnyi"
  Exclude:
    # rubocop-md checks each Ruby code block of a Markdown file as a file of its own; the blocks are excerpts.
    - "**/*.md"
  Notice: ^Copyright \(c\) 2026 Vitalii Lazebnyi$

# Sorbet/EmptyLineAfterSig requires `def` to follow its `sig` directly, so a method's documentation sits above the
# `sig`, where this cop does not look for it. Every method, public or not, is documented all the same: `rake yard`
# fails below 100% documented and on any YARD warning.
Style/DocumentationMethod:
  Enabled: false

# rubocop-md: the Ruby code blocks of the Markdown files are excerpts, not standalone programs.
Style/FrozenStringLiteralComment:
  Exclude:
    - "**/*.md"

# Neither style can hold. `fetch` (the safe one: it raises on a missing key) is also demanded of every other `[]`
# call, such as Sorbet's generic types (`T::Array[String]`) and MatchData, which have no `fetch`; `brackets`
# forbids `fetch` itself.
Style/HashLookupMethod:
  Enabled: false

plugins:
  - rubocop-md
  - rubocop-packaging
  - rubocop-performance
  - rubocop-rake
  - rubocop-rspec
  - rubocop-sorbet
  - rubocop-thread_safety

# The repository checks itself with its own cop (AI/AdverbSpam).
require:
  - ./lib/rubocop-ai
