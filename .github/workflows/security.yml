---
concurrency:
  cancel-in-progress: true
  group: ${{ github.workflow }}-${{ github.ref }}
jobs:
  bundler-audit:
    name: bundler-audit
    permissions:
      contents: read
    runs-on: ubuntu-26.04
    steps:
      - name: Harden the runner (egress allowed only to the endpoints below)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          allowed-endpoints: >-
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
            api.github.com:443
            github.com:443
            index.rubygems.org:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            rubygems.org:443
          disable-sudo-and-containers: true
          egress-policy: block
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1.338.0
        with:
          bundler: latest
          bundler-cache: true
          ruby-version: .ruby-version
          rubygems: latest
      - name: Check the Ruby version
        run: script/check_ruby.sh
      - run: script/check audit
    timeout-minutes: 10

  # Requires the repository's Dependency graph to be enabled (Settings > Code security).
  dependency-review:
    if: github.event_name == 'pull_request'
    name: Dependency review
    permissions:
      contents: read
      pull-requests: write # post the dependency review summary on the pull request
    runs-on: ubuntu-26.04
    steps:
      - name: Harden the runner (egress allowed only to the endpoints below)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          allowed-endpoints: >-
            api.deps.dev:443
            api.github.com:443
            api.securityscorecards.dev:443
            github.com:443
          disable-sudo-and-containers: true
          egress-policy: block
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          comment-summary-in-pr: on-failure
          fail-on-scopes: development, runtime, unknown
          fail-on-severity: low
    timeout-minutes: 10

  gitleaks:
    name: Secret scanning (gitleaks)
    permissions:
      contents: read
    runs-on: ubuntu-26.04
    steps:
      - name: Harden the runner (egress allowed only to the endpoints below)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          allowed-endpoints: >-
            api.github.com:443
            github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
          disable-sudo-and-containers: true
          egress-policy: block
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks (tools/releases.txt, pinned by SHA-256)
        run: script/install_tools.sh "${RUNNER_TEMP}/tools" gitleaks
      - name: Scan the full history for secrets
        run: script/check gitleaks
    timeout-minutes: 10

  warning-gate:
    if: ${{ !cancelled() }}
    name: Warning gate (Security)
    needs: [bundler-audit, dependency-review, gitleaks]
    permissions:
      actions: read # reads the logs of the other jobs of this run
      contents: read
    runs-on: ubuntu-26.04
    steps:
      - name: Harden the runner (egress allowed only to the endpoints below)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          allowed-endpoints: >-
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
            api.github.com:443
            github.com:443
          disable-sudo-and-containers: true
          egress-policy: block
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - env:
          GH_TOKEN: ${{ github.token }}
        name: Fail on any warning or deprecation in the logs of this run
        run: script/warning_gate.sh
    timeout-minutes: 10
name: Security
"on":
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: 17 4 * * 1
  workflow_dispatch: {}
# Nothing is writable by default; every job declares the permissions it needs.
permissions: {}
