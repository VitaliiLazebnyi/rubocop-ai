---
concurrency:
  cancel-in-progress: true
  group: ${{ github.workflow }}-${{ github.ref }}
jobs:
  # Markdown (rumdl), YAML (yamllint), EditorConfig, shell scripts (ShellCheck, shfmt), workflows (actionlint,
  # with ShellCheck on every run: script) and spelling (typos), with the tools pinned in tools/.
  lint:
    name: Markdown, YAML, EditorConfig, shell, workflows and spelling
    permissions:
      contents: read
    runs-on: ubuntu-26.04
    steps:
      - name: Harden the runner (egress allowed only to the endpoints below)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          allowed-endpoints: >-
            api.github.com:443
            files.pythonhosted.org:443
            github.com:443
            objects.githubusercontent.com:443
            pypi.org:443
            raw.githubusercontent.com:443
            release-assets.githubusercontent.com:443
          disable-sudo-and-containers: true
          egress-policy: block
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: 3.x
      - name: Install the linters (tools/releases.txt and tools/requirements.txt, pinned by SHA-256)
        run: script/install_tools.sh "${RUNNER_TEMP}/tools" actionlint editorconfig-checker shfmt python
      - run: script/check markdown yaml editorconfig shellcheck shfmt actionlint typos
    timeout-minutes: 10

  warning-gate:
    if: ${{ !cancelled() }}
    name: Warning gate (Lint)
    needs: [lint, zizmor]
    permissions:
      actions: read # reads the logs of the other jobs of this run
      contents: read
    runs-on: ubuntu-26.04
    steps:
      - name: Harden the runner (egress allowed only to the endpoints below)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          allowed-endpoints: >-
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
            api.github.com:443
            github.com:443
          disable-sudo-and-containers: true
          egress-policy: block
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - env:
          GH_TOKEN: ${{ github.token }}
        name: Fail on any warning or deprecation in the logs of this run
        run: script/warning_gate.sh
    timeout-minutes: 10

  zizmor:
    name: zizmor (auditor persona)
    permissions:
      contents: read
    runs-on: ubuntu-26.04
    steps:
      - name: Harden the runner (egress allowed only to the endpoints below)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          allowed-endpoints: >-
            api.github.com:443
            files.pythonhosted.org:443
            github.com:443
            objects.githubusercontent.com:443
            pypi.org:443
            raw.githubusercontent.com:443
            release-assets.githubusercontent.com:443
          disable-sudo-and-containers: true
          egress-policy: block
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: 3.x
      - name: Install zizmor (tools/requirements.txt, pinned by hash)
        run: script/install_tools.sh "${RUNNER_TEMP}/tools" python
      - env:
          GH_TOKEN: ${{ github.token }} # online audits (known-vulnerable actions, impostor commits, ...)
        run: script/check zizmor
    timeout-minutes: 10
name: Lint
"on":
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch: {}
# Nothing is writable by default; every job declares the permissions it needs.
permissions: {}
