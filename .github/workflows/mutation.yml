name: Mutation testing

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  LANG: C.UTF-8
  LC_ALL: C.UTF-8

jobs:
  mutant:
    name: Mutant
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    # HOLD (script/outdated_holds.yml, ruby.mutant): mutant 0.17.1 requires `parser/current`, and parser
    # 3.3.13.0 only has grammars up to Ruby 3.3, so on Ruby 3.4 and 4.0 it prints warnings. Mutation testing
    # runs on Ruby 3.3.13, the newest patch of the oldest supported Ruby, which the test matrix also covers.
    # `rake outdated` fails as soon as a newer mutant or parser is released, to re-check this hold.
    - uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1.335.0
      with:
        ruby-version: "3.3.13"
        rubygems: latest
        bundler: latest
        bundler-cache: true
    - name: Check the Ruby version
      run: script/check_ruby.sh 3.3.13
    # Ruby warnings are enabled after the toolchain is installed: RubyGems itself warns while
    # setup-ruby installs the bundle with them on. Every later step, and everything it runs, has them.
    - name: Enable Ruby warnings
      run: echo 'RUBYOPT=-W:deprecated -W:performance' >> "$GITHUB_ENV"
    # The whole gem is small enough to mutate on every change: every subject, every mutation, on pull
    # requests and pushes alike. Any alive mutation fails the build.
    - name: Mutant (every subject)
      run: bundle exec rake mutant

  warning-gate:
    name: Warning gate
    if: ${{ !cancelled() }}
    needs: [mutant]
    runs-on: ubuntu-26.04
    permissions:
      actions: read # reads the logs of the other jobs of this run
      contents: read
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Fail on any warning or deprecation in the logs of this run
      env:
        GH_TOKEN: ${{ github.token }}
        GATE_JOB_NAME: Warning gate
      run: script/warning_gate.sh
