---
concurrency:
  cancel-in-progress: true
  group: ${{ github.workflow }}-${{ github.ref }}
jobs:
  mutant:
    name: Mutant
    permissions:
      contents: read
    runs-on: ubuntu-26.04
    steps:
      - name: Harden the runner (egress allowed only to the endpoints below)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          allowed-endpoints: >-
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
            api.github.com:443
            github.com:443
            index.rubygems.org:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            rubygems.org:443
          disable-sudo-and-containers: true
          egress-policy: block
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # HOLD (script/outdated_holds.yml, ruby.mutant): mutant 0.17.1 requires `parser/current`, and parser 3.3.13.0
      # only has grammars up to Ruby 3.3, so on Ruby 3.4 and 4.0 it prints warnings. Mutation testing runs on Ruby
      # 3.3.13, the newest patch of the oldest supported Ruby, which the test matrix also covers. `rake outdated`
      # fails as soon as a newer mutant or parser is released, to re-check this hold.
      - uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1.338.0
        with:
          bundler: latest
          bundler-cache: true
          ruby-version: 3.3.13
          rubygems: latest
      - name: Check the Ruby version
        run: script/check_ruby.sh 3.3.13
      # The whole gem is small enough to mutate on every change: every subject, every mutation, on pull requests
      # and pushes alike. Any alive mutation fails the build.
      - run: script/check mutant
    timeout-minutes: 30

  warning-gate:
    if: ${{ !cancelled() }}
    name: Warning gate (Mutation testing)
    needs: [mutant]
    permissions:
      actions: read # reads the logs of the other jobs of this run
      contents: read
    runs-on: ubuntu-26.04
    steps:
      - name: Harden the runner (egress allowed only to the endpoints below)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          allowed-endpoints: >-
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
            api.github.com:443
            github.com:443
          disable-sudo-and-containers: true
          egress-policy: block
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - env:
          GH_TOKEN: ${{ github.token }}
        name: Fail on any warning or deprecation in the logs of this run
        run: script/warning_gate.sh
    timeout-minutes: 10
name: Mutation testing
"on":
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch: {}
# Nothing is writable by default; every job declares the permissions it needs.
permissions: {}
