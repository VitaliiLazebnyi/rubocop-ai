---
# Dependabot proposes every update of every ecosystem the repository pins, after a cooldown of a week; `rake
# outdated` (CI) fails while anything is outdated and not on the documented hold list (script/outdated_holds.yml).
updates:
  - cooldown:
      default-days: 7
    directory: /
    groups:
      development-dependencies:
        dependency-type: development
    package-ecosystem: bundler
    schedule:
      interval: weekly
  - cooldown:
      default-days: 7
    directory: /
    groups:
      github-actions:
        patterns:
          - "*"
    package-ecosystem: github-actions
    schedule:
      interval: weekly
  # The linters of tools/requirements.txt.
  - cooldown:
      default-days: 7
    directory: /tools
    groups:
      linters:
        patterns:
          - "*"
    package-ecosystem: pip
    schedule:
      interval: weekly
version: 2
